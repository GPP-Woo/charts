apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  realm.json: |-
{{ .Files.Get "files/realm.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KEYCLOAK_ADMIN, value: {{ .Values.keycloak.admin | quote }} }
            - { name: KEYCLOAK_ADMIN_PASSWORD, value: {{ .Values.keycloak.adminPassword | quote }} }
            # Fixed issuer host/port regardless of caller — the crux of browser/backend parity.
            - { name: KC_HOSTNAME, value: {{ .Values.keycloak.hostname | quote }} }
            - { name: KC_HOSTNAME_PORT, value: {{ .Values.keycloak.hostnamePort | quote }} }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HOSTNAME_STRICT_HTTPS, value: "false" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports:
            - { containerPort: 8080, name: http }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
          readinessProbe:
            httpGet: { path: /realms/{{ .Values.keycloak.realm }}, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector: { app: keycloak }
  ports:
    - { port: {{ .Values.keycloak.hostnamePort }}, targetPort: http, nodePort: {{ .Values.keycloak.nodePort }} }
