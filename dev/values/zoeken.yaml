# GPP-zoeken (search). Release name: zoeken. Uses the chart's bundled ECK Elasticsearch.
fullnameOverride: gpp-zoeken

image:
  # Native local build (hack/up.sh builds from ../GPP-zoeken and kind-loads it).
  # Avoids qemu-emulating the amd64 published image, which crashes uWSGI on arm64.
  repository: gpp-zoeken
  tag: local
  pullPolicy: Never

service:
  port: 8000

settings:
  secretKey: insecure-e2e-secret-key
  allowedHosts: "localhost,127.0.0.1,gpp-zoeken"
  # The index Job's default ttlSecondsAfterFinished=0 deletes it the instant it completes,
  # which races Helm 4's --wait (it watches the Job for completion and hangs when it
  # vanishes mid-watch). Keep it around briefly so Helm reliably observes completion.
  job:
    ttlSecondsAfterFinished: 120
  # Shared API token used by odbp -> zoeken (mirrors GPP-deploy).
  token: insecure-ea1a8d297e3b2d3313b8a30b18959c3
  database:
    host: db
    port: 5432
    username: postgres
    password: localdev
    name: woo_search
  elastic:
    # Use ECK's built-in `elastic` superuser (the chart doesn't provision a custom ES
    # user — its Elasticsearch CR leaves spec.auth empty). Password is auto-generated by
    # ECK and injected from its secret via extraEnvVars below (mirrors deploy/'s model).
    user: elastic
    password: overridden-by-extraEnvVars
    # ECK serves ES over TLS with a self-signed CA; point the app at the CA cert
    # mounted from ECK's public certs secret (see extraVolumes/extraVolumeMounts below).
    caCertsPath: /es-certs/ca.crt

# Source the elastic superuser password from ECK's operator-managed secret (overrides the
# ELASTICSEARCH_PASSWORD coming from the chart's own secret, since env wins over envFrom).
extraEnvVars:
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: gpp-eck-elasticsearch-es-elastic-user
        key: elastic

# Mount ECK's HTTP CA (from the operator-managed secret) into web + worker pods.
extraVolumes:
  - name: es-ca
    secret:
      secretName: gpp-eck-elasticsearch-es-http-certs-public
      items:
        - key: ca.crt
          path: ca.crt
extraVolumeMounts:
  - name: es-ca
    mountPath: /es-certs
    readOnly: true

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

ingress:
  enabled: false

# ECK single-node, modest resources for a kind node.
# The eck-operator (which ships the ECK CRDs) is installed as a SEPARATE release by
# hack/up.sh before this one — Helm can't create the Elasticsearch CR in the same
# release that first registers its CRD. So here we only create the Elasticsearch CR.
eck-elasticsearch:
  enabled: true
  # Single-node ES sized for a kind node. CPU requests/limits are REQUIRED: without them
  # the Elasticsearch CR reports condition ResourcesAwareManagement=False, and Helm 4's
  # --wait treats that False condition as "not ready" and blocks until timeout.
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests: { cpu: "500m", memory: 2Gi }
                limits:   { cpu: "2",    memory: 2Gi }
eck-operator:
  enabled: false

persistence:
  enabled: false
