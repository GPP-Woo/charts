apiVersion: v1
kind: ConfigMap
metadata:
  name: odrc-fixtures
data:
  odrc-api.json: |-
{{ .Files.Get "files/odrc-api.json" | indent 4 }}
  odrc-oidc.json: |-
{{ .Files.Get "files/odrc-oidc.json" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: odrc-seed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: odrc-seed }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: {{ .Values.image | quote }}
          # Inherit DB + Django settings from the odrc release.
          envFrom:
            - configMapRef: { name: {{ .Values.odrcConfigMap | quote }} }
            - secretRef: { name: {{ .Values.odrcSecret | quote }} }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for database..."
              until python {{ .Values.managePy }} showmigrations >/dev/null 2>&1; do sleep 3; done
              echo "Running migrations (idempotent)..."
              python {{ .Values.managePy }} migrate --noinput
              echo "Loading information categories (idempotent)..."
              python {{ .Values.managePy }} load_information_categories {{ .Values.informationCategories }}
              echo "Loading ODRC API token + admin OIDC fixtures..."
              python {{ .Values.managePy }} loaddata /fixtures/odrc-api.json /fixtures/odrc-oidc.json
              echo "Wiring GlobalConfiguration.gpp_search_service -> GPP-zoeken..."
              python {{ .Values.managePy }} shell -c "
              from zgw_consumers.models import Service
              from zgw_consumers.constants import APITypes, AuthTypes
              from woo_publications.config.models import GlobalConfiguration
              svc, created = Service.objects.update_or_create(
                  slug='gpp-zoeken',
                  defaults=dict(
                      label='GPP-zoeken (e2e)',
                      api_type=APITypes.orc,
                      api_root='{{ .Values.gppSearch.apiRoot }}',
                      auth_type=AuthTypes.api_key,
                      header_key='Authorization',
                      header_value='Token {{ .Values.zoeken.token }}',
                      timeout=30,
                  ),
              )
              cfg = GlobalConfiguration.get_solo()
              cfg.gpp_search_service = svc
              cfg.save()
              print('gpp_search_service', 'created' if created else 'updated', '->', svc.api_root)
              "
              echo "Seed complete."
          volumeMounts:
            - { name: fixtures, mountPath: /fixtures }
      volumes:
        - name: fixtures
          configMap: { name: odrc-fixtures }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zoeken-seed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: zoeken-seed }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: {{ .Values.zoeken.image | quote }}
          imagePullPolicy: Never
          # Inherit DB + Elasticsearch + Django settings from the zoeken release.
          envFrom:
            - configMapRef: { name: {{ .Values.zoeken.configMap | quote }} }
            - secretRef: { name: {{ .Values.zoeken.secret | quote }} }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for database..."
              until python {{ .Values.zoeken.managePy }} showmigrations >/dev/null 2>&1; do sleep 3; done
              echo "Running migrations (idempotent)..."
              python {{ .Values.zoeken.managePy }} migrate --noinput
              echo "Creating the Elasticsearch indices + mappings (idempotent)..."
              python {{ .Values.zoeken.managePy }} initialize_mappings
              echo "Seeding the API token the burgerportaal searches with (idempotent)..."
              python {{ .Values.zoeken.managePy }} shell -c "
              from woo_search.api.models import Application
              Application.objects.update_or_create(
                  token='{{ .Values.zoeken.token }}',
                  defaults={'contact_person': 'GPP-burgerportaal (dev)', 'email': 'dev@example.com', 'permissions': ['read', 'write']},
              )
              "
              echo "Seeding zgw Services so document body ingest can download from ODRC..."
              python {{ .Values.zoeken.managePy }} shell -c "
              from zgw_consumers.models import Service
              from zgw_consumers.constants import APITypes, AuthTypes
              # download_url Host comes from the e2e token-API Host header (FQDN) or
              # in-cluster bare svc name when ODRC indexes from inside the cluster.
              roots = [
                  '{{ .Values.publicatiebankDownload.apiRootFqdn }}',
                  '{{ .Values.publicatiebankDownload.apiRoot }}',
              ]
              for i, root in enumerate(roots):
                  svc, created = Service.objects.update_or_create(
                      slug=f'publicatiebank-download-{i}',
                      defaults=dict(
                          label=f'GPP-publicatiebank downloads ({root})',
                          api_type=APITypes.orc,
                          api_root=root,
                          auth_type=AuthTypes.api_key,
                          header_key='Authorization',
                          header_value='Token {{ .Values.zoeken.token }}',
                          timeout=30,
                      ),
                  )
                  print(svc.slug, 'created' if created else 'updated', '->', svc.api_root)
              "
              echo "Seed complete."
