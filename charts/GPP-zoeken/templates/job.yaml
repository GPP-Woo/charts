{{- if .Values.settings.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpp-zoeken.fullname" . }}-index
  labels:
    {{- include "gpp-zoeken.labels" . | nindent 4 }}
  {{- with .Values.settings.job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.settings.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.settings.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
      {{- with .Values.podAnnotations }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gpp-zoeken.labels" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gpp-zoeken.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: {{ .Values.settings.job.restartPolicy }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "gpp-zoeken.fullname" .) }}
            - configMapRef:
                name: {{ include "gpp-zoeken.fullname" . }}
          volumeMounts:
            - name: elastic-ca
              mountPath: /app/certs
            {{- if include "gpp-zoeken.logVolume.enabled" . }}
            - name: gpp-zoeken-log
              mountPath: {{ .Values.logVolume.mountPath }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "gpp-zoeken.tplvalues.render" ( dict "value" .Values.extraVolumeMounts "context" $ ) | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.extraEnvVars }}
            {{- include "gpp-zoeken.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          resources:
          {{- toYaml .Values.settings.job.resources | nindent 12 }}
          command:
            - "/bin/bash"
            - "-c"
          args:
          - |
            /app/src/manage.py initialize_mappings --wait {{ .Values.settings.job.waitForElasticTimeout }}
      volumes:
        - name: elastic-ca
          secret:
            secretName: {{ printf "%s-es-http-certs-public" (index .Values "eck-elasticsearch" "fullnameOverride")  }}
        {{- if include "gpp-zoeken.logVolume.enabled" . }}
        - name: gpp-zoeken-log
          {{- if .Values.logVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.logVolume.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "gpp-zoeken.tplvalues.render" ( dict "value" .Values.extraVolumes "context" $ ) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}