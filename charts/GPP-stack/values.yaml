global:
  settings:
    # -- Global databasehost, overrides setting.database.host
    databaseHost: ""

gpp-publicatiebank: 
  enabled: true
  redis:
    nameOverride: "gpp-publicatiebank-redis"

gpp-app:
  enabled: true

gpp-burgerportaal:
  enabled: true

gpp-zoeken:
  enabled: true
  redis:
    nameOverride: "gpp-zoeken-redis"
  # eck-operator subchart
  eck-operator:
    enabled: true
    nameOverride: "gpp-zoeken-eck-operator"
    fullnameOverride: "gpp-zoeken-eck-operator"

  # eck-elasticsearch subchart
  eck-elasticsearch:
    enabled: true
    nameOverride: "gpp-zoeken-eck-elasticsearch"
    fullnameOverride: "gpp-zoeken-eck-elasticsearch"


openzaak:
  enabled: true
  configuration:
    enabled: true
    sites:
      enabled: true
      openzaakDomain: openzaak.example.com
      organization: Gemeente Example
    notificatiesAuthorization:
      enabled: true
      notificationOpenzaakClientId: notif-client-id
      notifcationOpenzaakSecret: notif-secret
    notificaties:
      enabled: true
      ApiRoot: http://opennotificaties.example.nl/api/v1/
      openzaakNotifcationClientId: oz-client-id
      openzaakNotificationSecret: oz-secret
    selectieLijst:
      enabled: true
      ApiRoot: https://selectielijst.openzaak.nl/api/v1/
      ApiOas:  https://selectielijst.openzaak.nl/api/v1/schema/openapi.yaml
      AllowedYears: [2017, 2020]
      DefaultYear: 2020
    superuser:
      username: ""
      password: ""
      email: ""
    cronjob:
      # -- Schedule to run the clean logged notifications cronjob
      schedule: "0 0 * * *"
      historyLimit: 1
      resources: {}

  tags:
    redis: true

  replicaCount: 1

  image:
    repository: openzaak/open-zaak
    pullPolicy: IfNotPresent
    # -- Open Zaak image tag. Empty uses the openzaak subchart's `appVersion`, which is still 1.30.0 in chart 1.16.0-rc.1. <details><summary>More information</summary> `1.31.1-perftest` is upstream's pre-release cut of Open Zaak 1.31.1, the version this umbrella line is tested with. Open Zaak 1.31 fixes concurrent unlocks of same-named uploads silently overwriting each other's content (open-zaak#2592; after upgrading, run the read-only `detect_overwritten_documents` management command, see Open Zaak's 1.31.0 changelog). GPP-publicatiebank 3.0.0 needs open-zaak#2607 (from 1.31.1) to re-link existing documents to its own informatieobjecttypen. This override goes once the openzaak chart ships a matching `appVersion`.</details>
    tag: "1.31.1-perftest"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automountServiceAccountToken: true

  podAnnotations: {}

  podLabels: {}

  podSecurityContext:
    fsGroup: 1000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    className: ""
    # -- ingress hosts
    hosts: []
    #  - host: openformulieren.gemeente.nl
    #    paths:
    #      - path: /
    #        pathType: ImplementationSpecific
    tls: []
    #  - secretName: openzaak-tls
    #    hosts:
    #      - openformulieren.gemeente.nl

  # -- Specify extra ingresses, for example if you have multiple ingress classes
  extraIngress: []
  # e.g:
  # extraIngress:
  #  - name: openzaak-azuregateway
  #    annotations:
  #      appgw.ingress.kubernetes.io/ssl-redirect: "true"
  #    className: azure-application-gateway
  #    hosts:
  #      - host: openzaak.gemeente.nl
  #        paths:
  #          - path: /
  #            pathType: ImplementationSpecific
  #            servicename: openzaak
  #            portNumber: 8000
  #    tls:
  #      - secretName: openzaak-tls
  #        hosts:
  #          - "openzaak.gemeente.nl"

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  pdb:
    create: false
    minAvailable: 1
    maxUnavailable: ""

  nodeSelector: {}

  tolerations: []

  affinity: {}

  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
    existingClaim: null
    mediaMountSubpath: openzaak/media
    privateMediaMountSubpath: openzaak/private_media

  # Existing Secret must be defined for AzureVaultSecret to work
  existingSecret: null

  # This will create an AzureVaultSecret object in k8s, only Multi Key Value Secret are supported by this chart
  # ref: https://akv2k8s.io/tutorials/sync/4-multi-key-value-secret/ https://learn.microsoft.com/en-us/azure/key-vault/secrets/multiline-secrets
  # Using this feature requires you to define existingSecret
  azureVaultSecret:
    # The name of the Azure Key Vault, setting this will create the AzureVaultSecret
    vaultName: null
    # The name of the Multi Key Value Secret
    objectName: ""
    # Make sure this matches the content of the secret, can be either 'application/x-json' or 'application/x-yaml'
    contentType: ""
    # You must set .Values.existingSecret
    secretName: "{{ .Values.existingSecret }}"

  # extraEnvVars Array with extra environment variables to add to openzaak
  # e.g:
  # extraEnvVars:
  #   - name: FOO
  #     value: "bar"
  #
  extraEnvVars: []
  # extraVolumes Optionally specify extra list of additional volumes
  # e.g:
  # extraVolumes:
  #   - name: verify-certs
  #     configMap:
  #       name: verify-certs
  #
  extraVolumes: []
  # extraVolumeMounts Optionally specify extra list of additional volumeMounts
  # e.g:
  # extraVolumeMounts:
  #  - name: verify-certs
  #    mountPath: /etc/ssl/certs/extra-certs/
  extraVolumeMounts: []
  # Path to extra certificates or CA (root) certificates, comma seperated
  # Wardning, If the file does not exist the pod(s) will not start
  # e.g.
  # extraVerifyCerts: /etc/ssl/certs/extra-certs/staatdernederlandeng1.pem
  extraVerifyCerts: ""

  # Extra objects to deploy (value evaluated as a template)
  extraDeploy: []

  settings:
    allowedHosts: ""
    djangoSettingsModule: openzaak.conf.docker
    useXForwardedHost: true

    # -- Generate secret key at https://djecrety.ir/
    secretKey: ""

    environment: ""

    database:
      host: open-zaak-postgresql
      port: 5432
      username: postgres
      password: ""
      name: openzaak
      sslmode: prefer

    # -- use 2 if enabling ingress
    numProxies: 1

    email:
      host: localhost
      port: 25
      username: ""
      password: ""
      useTLS: false

    flower:
      urlPrefix: ""
      basicAuth: ""

    elasticapm:
      url: ""
      token: ""
      serviceName: ""

    sentry:
      dsn: ""

    # Cache settings, when the redis subchart is enabled these settings will be ignored and caching will default to the redis subchart services.
    cache:
      # default: openzaak-redis-master-0:6379/0
      # axes: openzaak-redis-master-0:6379/0
      # portalLocker: openzaak-redis-master-0:6379/0
      default: ""
      axes: ""
      portalLocker: ""

    celery:
      # -- Deploy celery (worker), celery is required from openzaak version 1.8.0
      enabled: true
      # Celery cache settings, when the redis subchart is enabled these settings will be ignored and caching will default to the redis subchart services
      # e.g.:
      # brokerUrl: redis://openzaak-redis-master:6379/1
      # resultBackend: redis://openzaak-redis-master:6379/1
      brokerUrl: ""
      resultBackend: ""
      logLevel: debug

    notificationsDisabled: false

    jwtExpiry: 3600

    cmis:
      enabled: false
      mapperFile: ""

    isHttps: true

    debug: false

    uwsgi:
      master: ""
      threads: ""
      processes: ""
      maxRequests: ""
      harakiri: ""

  worker:
    replicaCount: 1
    concurrency: 4
    podLabels: {}
    resources: {}
    # No livenessProbe/readinessProbe here: openzaak >= 1.15.0 enables its own worker
    # startup + liveness probes (maykin-common), and the subchart's timings (liveness:
    # period 60s, timeout 15s, failureThreshold 6) suit a check that starts a Python
    # process and pings the broker. The subchart has no worker readiness probe.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

  nginx:
    image:
      repository: nginxinc/nginx-unprivileged
      pullPolicy: IfNotPresent
      tag: stable
    service:
      type: ClusterIP
      port: 80
      annotations: {}
    # -- mount existing nginx vhost config
    existingConfigmap: null
    replicaCount: 1
    podLabels: {}
    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 101
    autoscaling:
      enabled: false
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    resources: {}

  flower:
    enabled: true
    replicaCount: 1
    podLabels: {}
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    resources: {}

  beat:
    # -- Run Open Zaak's Celery beat Deployment (the subchart's own default is `true`). <details><summary>More information</summary> Open Zaak schedules one periodic task of its own: the daily removal of finished bulk imports (`remove_imports`) of its document import feature, which GPP does not use. Periodic tasks added in Open Zaak's admin (django-celery-beat) would need beat too. `false` renders no beat Deployment at all; up to openzaak chart 1.15.0 the only way to stop it was `beat.replicaCount: 0`, which still rendered the Deployment.</details>
    enabled: false

  # Redis subchart
  redis:
    nameOverride: "openzaak-redis"
    architecture: standalone
    auth:
      enabled: false
    master:
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
    # FIXME
    # This is needed because gpp-publicatiebank has a newer redis chart version
    # and the labels are shared globally. When OZ redis chart version is upgraded, this
    # can be removed.
    sentinel:
      masterService:
        enabled: false
